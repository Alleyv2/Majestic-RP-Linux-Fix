# Majestic RP Linux Fix — GTA V FPS overlay
# This file is loaded only for the Proton process tree started by the fix.

preset=1
position=top-right
font_size=28
background_alpha=0.35
round_corners=6
hud_no_margin
text_outline
text_outline_thickness=1.5
toggle_hud=Shift_R+F12

# Do not draw an overlay over the launchers. GTA5.exe is intentionally absent.
blacklist=Majestic Launcher.exe,LauncherPatcher.exe,Rockstar Games Launcher.exe,Launcher.exe,RockstarService.exe,SocialClubHelper.exe
