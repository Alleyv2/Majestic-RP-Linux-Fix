name: Build standalone Linux release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install build dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt -r requirements-build.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build standalone executable
        run: ./scripts/build_release.sh
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Majestic-RP-Linux-Fix-linux-x86_64
          path: |
            dist/Majestic-RP-Linux-Fix-x86_64
            dist/Majestic-RP-Linux-Fix-v1.2.0-linux-x86_64.tar.gz
            dist/SHA256SUMS
      - name: Create or update GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" --clobber \
              dist/Majestic-RP-Linux-Fix-x86_64 \
              dist/Majestic-RP-Linux-Fix-v1.2.0-linux-x86_64.tar.gz \
              dist/SHA256SUMS
          else
            gh release create "$TAG" --verify-tag --generate-notes --latest \
              --title "Majestic RP Linux Fix 1.2.0" \
              dist/Majestic-RP-Linux-Fix-x86_64 \
              dist/Majestic-RP-Linux-Fix-v1.2.0-linux-x86_64.tar.gz \
              dist/SHA256SUMS
          fi
